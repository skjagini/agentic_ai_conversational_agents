[project]
name = "agentic-ai-conversational-agents"
version = "0.1.0"
description = "Lab environment for Agentic AI: Conversational Agents (the Chinook support copilot)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Same direct pins as requirements.txt (Colab). Checked 10 Oct 2026; reasons for each pin in the lab plan.
dependencies = [
  "langchain==1.4.3",
  "langchain-core==1.6.6",
  "langchain-openai==1.6.7",
  "langchain-classic==1.0.8",
  "langchain-text-splitters==1.1.3",
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai==3.24.0",
  "tiktoken==0.14.0",
  "faiss-cpu==1.15.1",
  "gradio==6.29.0",
  "huggingface-hub==1.33.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "langsmith==0.14.2",
  "matplotlib==3.10.0",
]

[dependency-groups]
dev = [
  "ipykernel==7.4.0",
  "jupyterlab==4.6.4",
]
